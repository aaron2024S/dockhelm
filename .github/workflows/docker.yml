name: docker

# 只在「真的要发一版」的时候跑：
#   - 打 tag：git push origin v0.4.6
#   - 或在 Actions 页面手动 Run workflow
# 推 main 不再触发任何构建 —— 日常代码提交不会碰 Docker Hub 上的任何 tag。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # 正常情况下整个作业一两分钟就完了（见 Dockerfile 里钉 $BUILDPLATFORM 的说明）。
    # 给个上限是为了让「真的卡住」变成一次快速失败，而不是让人对着转圈猜半小时。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: 版本号一致性闸门
        # 排在最前面：三处声明不一致（version.go / package.json / config.ts）
        # 或 tag 与声明不一致时，直接失败，不浪费一次构建与推送。
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            bash scripts/check-version.sh --expect-tag "$REF_NAME"
          else
            bash scripts/check-version.sh
          fi

      - name: 从 internal/version/version.go 读出版本号
        id: meta
        run: |
          V=$(grep -oE '^var Version = "[^"]+"' internal/version/version.go | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$V" ]; then echo "读不到版本号"; exit 1; fi
          echo "version=$V"                 >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "版本号 = $V"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # 每个正式发版都推两个 tag：版本号 + latest
          #   - <用户名>/dockhelm:0.4.6   ← 固定版本，部署时建议用这个
          #   - <用户名>/dockhelm:latest  ← 总是指向最近一次发版，图省事的人用它
          # 注意：手动 Run workflow 也会移动 latest，所以别拿这个 job 做试探性构建。
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dockhelm:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dockhelm:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 摘要
        run: |
          {
            echo "### Dockhelm \`${{ steps.meta.outputs.version }}\` 已推送"
            echo ""
            echo "- 镜像：\`${{ secrets.DOCKERHUB_USERNAME }}/dockhelm:${{ steps.meta.outputs.version }}\`（同时更新 \`:latest\`）"
            echo "- 平台：linux/amd64, linux/arm64"
            echo "- 提交：\`${{ steps.meta.outputs.commit_short }}\`"
            echo "- 构建时间：${{ steps.meta.outputs.build_time }}"
          } >> "$GITHUB_STEP_SUMMARY"
